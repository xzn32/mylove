<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Lily</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;font-family:ui-monospace,Menlo,monospace}
canvas{display:block;width:100%;height:calc(100% - 56px)}
#bar{height:56px;display:flex;align-items:center;justify-content:center}
button{background:#1a1a1a;color:#eee;border:1px solid #444;border-radius:20px;padding:9px 18px;font:13px ui-monospace,Menlo,monospace}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"><button id="replay">▶ replay</button></div>
<script>
/* ===== SETTINGS ===== */
const COLS=70, ROWS=64, GROW=5, BLOOM=7;   // grid size, seconds to grow, seconds to open
const PHRASE="loveyou";                    // the flower is made of these letters (try "iloveyou")
const SONG_URL="";                         // <-- your song file, e.g. "angel.mp3"

/* ===== HELPERS ===== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const WORD=PHRASE.replace(/\s/g,'');
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k;
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const noise=(x,y)=>{const n=Math.sin(x*12.9898+y*78.233)*43758.5453;return n-Math.floor(n);};
// letter for a spot: same spot = same letter, so the words read across. big = capital (brighter parts)
const letter=(x,y,big)=>{const c=WORD[(x+y*3)%WORD.length];return big?c.toUpperCase():c;};

/* ===== STEM + LEAVES (static) ===== */
const CX=35, BASE=29, map=new Map();
const stemX=y=>CX+2.4*Math.sin((y-BASE)/34*Math.PI*1.1);
function put(x,y,h,s,l,ch){if(x<0||x>=COLS||y<0||y>=ROWS)return;map.set(y*COLS+x,{x,y,h,s,l,ch});}
function leaf(sx,sy,dx,dy,len,wid){                 // long narrow lily leaf
  const n=Math.hypot(dx,dy); dx/=n; dy/=n;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const px=x-sx, py=(y-sy)*1.8, u=(px*dx+py*dy)/len, v=-px*dy+py*dx;
    if(u<=0||u>=1)continue;
    const w=wid*Math.pow(Math.sin(Math.PI*Math.pow(u,.8)),.9);
    if(Math.abs(v)>=w)continue;
    const l=Math.abs(v)<.8?64:38+rnd(0,16)+(v>0?8:0);
    put(x,y,132,60,l,letter(x,y,l>50));
  }
}
for(let y=BASE;y<ROWS;y++){const x0=Math.round(stemX(y));
  for(let i=0;i<2;i++){const l=rnd(36,60);put(x0+i,y,130,60,l,letter(x0+i,y,l>50));}}
leaf(stemX(42)+2,42, .9,-.45,26,2.8);
leaf(stemX(50)-1,50,-.9,-.45,28,3);
leaf(stemX(57)+2,57, .9,-.4, 22,2.4);
const cells=[...map.values()], rowCells=Array.from({length:ROWS},()=>[]);
cells.forEach(c=>rowCells[c.y].push(c));

/* ===== THE LILY: 6 pointed petals that unfold and curl back ===== */
const FULL_RX=22, BASEY=(BASE-1)*1.8;
const LAYERS=[   // len/wid = size, tb/tt = base/tip tilt when open, delay = when it starts opening
  {n:3,len:31,wid:10,tb:.40,tt:2.1,delay:0,  off:0},
  {n:3,len:29,wid:12,tb:.30,tt:1.9,delay:.12,off:Math.PI/3}
];
const PETALS=[];
LAYERS.forEach((L,k)=>{for(let i=0;i<L.n;i++)PETALS.push({k,L,phi:i/L.n*Math.PI*2+L.off+.3});});
const NC=ROWS*COLS, QB=new Float32Array(NC), UB=new Float32Array(NC), grid=new Array(NC);

function bloomCells(b){                              // b: 0 = closed bud, 1 = open lily
  grid.fill(null);
  const list=PETALS.map(p=>{
    const op=ease(clamp((b-p.L.delay)/.6,0,1)), phi=p.phi+(1-op)*.8;
    return {p,op,phi,key:Math.cos(phi)};
  }).sort((a,c)=>a.key-c.key);                       // back petals first, front last
  for(const {p,op,phi} of list){
    const L=p.L, cs=Math.cos(phi), sn=Math.sin(phi);
    const tb=lerp(.04,L.tb,op), tt=lerp(.08,L.tt,op);   // tilt: up -> outward and curled back
    let r=1.2*(.3+.7*op), z=0; const n=18, ds=L.len/n;
    QB.fill(9);
    for(let i=0;i<=n;i++){
      const u=i/n, th=lerp(tb,tt,Math.pow(u,1.6));       // tips curl the most
      const wd=L.wid/2*Math.pow(Math.sin(Math.PI*Math.pow(clamp(u,.01,1),.75)),.9); // pointed tip
      const rad=Math.max(.8,wd*(.55+.45*Math.abs(cs)));
      const xp=CX+r*sn, yp=BASEY-(z-.3*r*cs);
      const y0=Math.floor((yp-rad)/1.8), y1=Math.ceil((yp+rad)/1.8);
      for(let y=y0;y<=y1;y++){ if(y<0||y>BASE)continue;
        for(let x=Math.floor(xp-rad);x<=Math.ceil(xp+rad);x++){ if(x<0||x>=COLS)continue;
          const d=Math.hypot(x-xp,y*1.8-yp)/rad, idx=y*COLS+x;
          if(d<1&&d<QB[idx]){QB[idx]=d;UB[idx]=u;}
        }}
      r+=Math.sin(th)*ds; z+=Math.cos(th)*ds;
    }
    const lt=.5-.5*sn;
    for(let idx=0;idx<NC;idx++){
      const q=QB[idx]; if(q>=1)continue;
      const x=idx%COLS, y=(idx/COLS)|0, u=UB[idx];
      let l=40+38*Math.pow(u,.7)*(.7+.3*lt)+6*lt-(cs<0?10:0), s=lerp(85,55,u);
      if(q<.15)l-=12;                                    // center line of the petal
      if(q>.85)l-=8;                                     // soft edge
      if(noise(x,y)>.9&&u>.15&&u<.7){l-=22;s=90;}        // lily speckles
      l=clamp(l,20,86);
      grid[idx]={x,y,h:338,s,l,ch:letter(x,y,l>58)};
    }
  }
  const so=ease(clamp((b-.25)/.6,0,1));                  // stamens come out as it opens
  if(so>0)for(let i=0;i<6;i++){
    const phi=i*Math.PI/3+.5;
    for(let t=0;t<=1;t+=.04){
      const r=lerp(0,13,Math.pow(t,1.4))*so, z=lerp(2,24,Math.sin(t*Math.PI/2))*(.4+.6*so);
      const x=Math.round(CX+r*Math.sin(phi)), y=Math.round((BASEY-(z-.3*r*Math.cos(phi)))/1.8);
      if(y<0||y>BASE)continue;
      const anther=t>.9;
      for(let dx=anther?-1:0;dx<=(anther?1:0);dx++){
        const xx=x+dx; if(xx<0||xx>=COLS)continue;
        grid[y*COLS+xx]=anther?{x:xx,y,h:28,s:95,l:55,ch:letter(xx,y,true)}
                              :{x:xx,y,h:95,s:40,l:78,ch:letter(xx,y,true)};
      }
    }
  }
  return grid.filter(Boolean);
}

/* ===== NAME made of letters, same style as the flower ===== */
const NAME="naz";                                   // <-- change the name here
const nameCells=(()=>{
  const o=document.createElement('canvas'); o.width=COLS; o.height=Math.round(ROWS*1.8);
  const g=o.getContext('2d'); g.fillStyle='#fff'; g.textAlign='center'; g.textBaseline='alphabetic';
  g.font='900 27px Arial Black, Arial, sans-serif';
  const size=27*Math.min(1,52/g.measureText(NAME).width);      // shrink long names to fit
  g.font=`900 ${size}px Arial Black, Arial, sans-serif`;
  g.fillText(NAME,COLS/2,17);                                    // draw it, then read the pixels
  const d=g.getImageData(0,0,o.width,o.height).data, out=[];
  for(let y=0;y<12;y++)for(let x=0;x<COLS;x++){
    const py=Math.min(o.height-1,Math.floor((y+.5)*1.8));
    if(d[(py*o.width+x)*4+3]>110){const l=48+noise(x,y)*18;out.push({x,y,l,ch:letter(x,y,l>58)});}
  }
  return out;
})();

/* ===== SETUP + SONG ===== */
const stars=Array.from({length:80},()=>({x:Math.random(),y:Math.random(),p:rnd(0,6.28),s:rnd(.5,2.2)}));
let t0=performance.now(), sparks=[], hearts=[], lastHeart=0, cw, ch, ox;
function resize(){
  const d=devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  cw=Math.min(W/(COLS+2),H/ROWS/1.8); ch=cw*1.8; ox=(W-COLS*cw)/2;
}
addEventListener('resize',resize); resize();
const audio=new Audio(); audio.loop=true; if(SONG_URL)audio.src=SONG_URL;
function restart(){t0=performance.now();sparks=[];hearts=[];
  if(audio.src){audio.currentTime=0;audio.play().catch(()=>{});}}   // sound needs a tap, so replay starts it
document.getElementById('replay').onclick=restart;

/* ===== ANIMATION LOOP ===== */
function frame(now){
  const t=(now-t0)/1000, W=cv.clientWidth, H=cv.clientHeight;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  for(const s of stars){                                  // twinkling stars
    const al=.2+.55*Math.abs(Math.sin(now/700+s.p)), x=s.x*W, y=s.y*H;
    ctx.fillStyle=`rgba(255,255,255,${al})`; ctx.fillRect(x,y,s.s,s.s);
    if(s.s>1.7){ctx.fillRect(x-4,y+s.s/2,9,.6);ctx.fillRect(x+s.s/2,y-4,.6,9);}
  }
  const pg=ease(clamp(t/GROW,0,1)), head=ROWS+1-pg*(ROWS+1-BASE+2);   // light climbs the stem
  const bt=clamp((t-GROW)/BLOOM,0,1), b=ease(bt), bloomA=clamp((t-GROW)/.8,0,1);
  const sway=Math.sin(t*.8)*.04*clamp(t/(GROW+BLOOM),0,1), swayX=y=>(ROWS-1-y)*Math.sin(sway);
  if(bloomA>0){                                           // pink glow
    const gx=ox+CX*cw, gy=(BASE-10)*ch, gr=(8+22*b)*cw, gd=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
    gd.addColorStop(0,`rgba(255,110,170,${.22*bloomA*(.5+.5*b)})`); gd.addColorStop(1,'rgba(255,110,170,0)');
    ctx.fillStyle=gd; ctx.fillRect(0,0,W,H);
  }
  ctx.font=`${cw*1.7}px ui-monospace,Menlo,monospace`; ctx.textBaseline='top';
  let count=0;
  for(const c of cells){                                  // stem + leaves
    const a=Math.min(1,(c.y-head)/3); if(a<=0)continue; count++;
    ctx.fillStyle=`hsla(${c.h},${c.s}%,${c.l}%,${a})`;
    ctx.fillText(c.ch,ox+(c.x+swayX(c.y))*cw,c.y*ch);
  }
  let bc=[];
  if(bloomA>0){                                           // the lily
    bc=bloomCells(b);
    for(const c of bc){
      ctx.fillStyle=`hsla(${c.h},${c.s}%,${c.l+3*Math.sin(t*1.5+c.x*.3+c.y*.2)}%,${bloomA})`;
      ctx.fillText(c.ch,ox+(c.x+swayX(c.y))*cw,c.y*ch);
    }
    count+=bc.length;
  }
  if(t<GROW+BLOOM){                                       // sparks
    if(t<GROW){const row=rowCells[clamp(Math.round(head),0,ROWS-1)];
      if(row.length)for(let i=0;i<6;i++){const c=row[Math.floor(Math.random()*row.length)];
        sparks.push({x:c.x,y:head,vx:rnd(-.6,.6),vy:rnd(-1.1,-.2),life:1});}}
    else if(bc.length)for(let i=0;i<4;i++){const c=bc[Math.floor(Math.random()*bc.length)];
      sparks.push({x:c.x,y:c.y,vx:rnd(-.8,.8),vy:rnd(-1.2,-.3),life:1});}
  }
  for(const s of sparks){s.x+=s.vx*.05;s.y+=s.vy*.1;s.life-=.012;
    ctx.fillStyle=`rgba(255,235,220,${Math.max(0,s.life)})`;
    ctx.fillText(Math.random()<.5?'*':'·',ox+s.x*cw,s.y*ch);}
  sparks=sparks.filter(s=>s.life>0);
  if(bt>=1&&now-lastHeart>700){lastHeart=now;                // hearts float down when fully open
    hearts.push({x:CX+rnd(-14,14),y:BASE-rnd(10,16),ph:rnd(0,6),life:1});}
  for(const q of hearts){q.y+=.045;q.x+=Math.sin(now/500+q.ph)*.03;q.life-=.0018;
    ctx.fillStyle=`hsla(340,85%,65%,${clamp(q.life,0,1)})`;ctx.fillText('♥',ox+q.x*cw,q.y*ch);}
  hearts=hearts.filter(q=>q.life>0&&q.y<ROWS-1);
  ctx.fillStyle='#888'; ctx.font=`${cw*1.2}px ui-monospace,Menlo,monospace`;
  ctx.fillText('love you · 2026',8,H-ch*3.6);
  ctx.fillText(`bloom ${(b*100).toFixed(1)}%   sway ${(sway*57.3).toFixed(2)}°`,8,H-ch*2.4);
  ctx.fillText(`letters ${count.toLocaleString()}   t ${t.toFixed(2)}s`,8,H-ch*1.2);
  // name made of letters, red, fades in with the flower
  ctx.font=`${cw*1.7}px ui-monospace,Menlo,monospace`;
  for(const c of nameCells){
    ctx.fillStyle=`hsla(355,90%,${c.l+6*Math.sin(t*2+c.x*.4+c.y*.3)}%,${bloomA})`;
    ctx.fillText(c.ch,ox+c.x*cw,c.y*ch);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
